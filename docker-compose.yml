services:
  mongo:
    image: mongo:7
    command: ["--quiet"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/image-annotation
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      TEST_MONGODB_URI: mongodb://mongo:27017/annotations_test

volumes:
  mongo-data:
